name: 生成亚马逊旗舰店调研Excel

"on":
  workflow_dispatch:

jobs:
  generate-excel:
    name: 生成并上传Excel
    runs-on: ubuntu-latest

    steps:
      - name: 检出当前代码库
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装 Python 依赖
        run: python -m pip install -r requirements.txt

      - name: 运行脚本生成 Excel
        run: python generate_amazon_store_research.py

      - name: 验证 Excel 文件已生成
        run: |
          test -f "亚马逊品牌旗舰店竞品调研.xlsx"
          test -s "亚马逊品牌旗舰店竞品调研.xlsx"

      - name: 上传 Excel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amazon-store-research-excel
          path: 亚马逊品牌旗舰店竞品调研.xlsx
          if-no-files-found: error
          retention-days: 30
